apiVersion: v1
kind: Secret
metadata:
  name: auth-api-secrets
  namespace: auth
type: Opaque
stringData:
  # Database - Set via GitHub Secrets
  postgresUrl: "${POSTGRES_URL}"

  # Redis - Set via GitHub Secrets
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # OAuth State Secret (for CSRF protection) - Set via GitHub Secrets
  OAUTH_STATE_SECRET: "${OAUTH_STATE_SECRET}"

  # Google OAuth - Set via GitHub Secrets
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"

  # GitHub OAuth - Set via GitHub Secrets (use same names as local dev: GIT_APP_ID, GIT_APP_SECRET)
  GIT_APP_ID: "${GIT_APP_ID}"
  GIT_APP_SECRET: "${GIT_APP_SECRET}"

  # Microsoft OAuth (Azure AD) - Set via GitHub Secrets
  MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID}"
  MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET}"
  MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID}"

  # Seed credentials - Set via GitHub Secrets
  SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL}"
  SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD}"
  DEFAULT_TENANT_SLUG: "${DEFAULT_TENANT_SLUG}"
